<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>שאלון חניכים - ניצנים</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body dir="rtl">
    <div id="app">
      <div class="nz-hero nz-hero--wait" role="status">
        <div class="nz-hero__brand">
          <img src="logo.webp" alt="ניצנים">
          <div class="nz-hero__brand-rule"></div>
        </div>
        <div class="nz-hero__art">
          <svg class="nz-build nz-build--loading" viewBox="-2 -2 124 84" aria-hidden="true"><polygon points="96,24 120,24 120,56 96,56"/><polygon points="96,24 96,56 70,56"/><polygon points="70,24 96,24 70,56"/><polygon points="70,24 70,56 44,56"/><polygon points="44,24 70,24 44,56"/><polygon points="0,40 44,40 44,80"/><polygon points="0,40 44,0 44,40"/></svg>
        </div>
        <h1 class="nz-hero__title nz-hero__title--wait">טוען את השאלון...</h1>
        <p class="nz-hero__lead" id="nz-wait-hint">זה יכול לקחת כמה שניות.</p>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
